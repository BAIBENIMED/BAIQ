<!doctype html>
<html lang="fr">
  <head>
    <!--
      Redirection vers le service Web qui fait réellement tourner server.js.
      baiq.onrender.com reste un Static Site historique (Render n'exécute jamais
      de backend sur ce type de service : /api/* y répond 404, le compteur global
      et l'Assistant IA n'y ont jamais fonctionné). Le service actif est
      baiq-web.onrender.com. Un Redirect Rule côté Render couvre déjà les chemins
      qui n'ont pas de fichier statique correspondant, mais la racine "/" sert
      toujours cet index.html en priorité — d'où ce filet de sécurité, restreint
      au seul ancien nom d'hôte pour ne jamais s'appliquer au service actif.
    -->
    <script>
      if (location.hostname === 'baiq.onrender.com') {
        location.replace('https://baiq-web.onrender.com' + location.pathname + location.search + location.hash);
      }
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BAIQ — Balance and Financial Analytics | Comptabilité SCF, Finance &amp; Analyse</title>
    <meta name="description" content="BAIQ — Balance and Financial Analytics. Plateforme d&apos;Intelligence Financière &amp; Comptable. Bilan SCF, SIG, Ratios, Score Altman Z&apos;&apos;, Rating Bancaire &amp; Export Excel." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      /* Force le chargement des Material Symbols en mode bloc pour éviter les carrés */
      @import url('https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block');
      .material-symbols-outlined {
        font-family: 'Material Symbols Outlined';
        font-weight: normal;
        font-style: normal;
        font-size: 24px;
        display: inline-block;
        line-height: 1;
        text-transform: none;
        letter-spacing: normal;
        word-wrap: normal;
        white-space: nowrap;
        direction: ltr;
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
